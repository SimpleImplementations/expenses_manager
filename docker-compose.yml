services:
  app:
    build:
      context: .
      target: ${BUILD_TARGET:-dev}
    restart: unless-stopped
    env_file: .env
    volumes:
      - ${DB_VOLUME:-./db}:/var/lib/bot

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://app:8080 --metrics 0.0.0.0:2999
    restart: unless-stopped
